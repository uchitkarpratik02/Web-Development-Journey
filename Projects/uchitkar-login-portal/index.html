<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uchitkar Institute | Login Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="login-container">
    
    <section class="showcase-side" aria-label="Uchitkar Institute Campus Showcase">
      <div class="showcase-content">
        <div class="logo-wrapper">
          <span class="uni-logo">🎓</span>
          <span class="uni-name">Uchitkar Institute</span>
        </div>
        <h1>Empowering Excellence, Shaping Futures.</h1>
        <p>Access your academic portal, campus resources, and student community all in one secure place.</p>
      </div>
    </section>

    <section class="form-side" aria-label="Student and Faculty Authentication Form">
      <div class="form-content">
        
        <header class="form-header">
          <h2>Welcome Back Portal</h2>
          <p>Please enter your institutional credentials to log in.</p>
        </header>

        <form class="login-form">
          
          <div class="input-group">
            <label for="user-id">Institutional Email or ID</label>
            <div class="input-field-wrapper">
              <span class="input-icon">✉️</span>
              <input type="email" id="user-id" required placeholder="username@uchitkar.edu">
            </div>
          </div>

          <div class="input-group">
            <label for="user-password">Password</label>
            <div class="input-field-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="user-password" required placeholder="••••••••••••">
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="submit-btn">Secure Sign In</button>
          
        </form>

        <footer class="form-footer">
          <p>Need assistance? Contact the <a href="#">IT Helpdesk</a></p>
        </footer>

      </div>
    </section>

  </main>

</body>
</html>
