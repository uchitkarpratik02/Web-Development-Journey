<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-card">
        <h2 class="card-title">Currency Converter</h2>
        
        <form id="converter-form">
            <div class="form-group">
                <label class="form-label" for="amount">Amount</label>
                <input type="number" id="amount" value="1" min="0" step="any" class="form-input" required>
            </div>

            <div class="currency-row">
                <div class="select-group">
                    <label class="form-label" for="from-currency">From</label>
                    <select id="from-currency" class="form-select"></select>
                </div>

                <button type="button" id="swap-btn" class="swap-button" title="Swap Currencies">
                    🔄
                </button>

                <div class="select-group">
                    <label class="form-label" for="to-currency">To</label>
                    <select id="to-currency" class="form-select"></select>
                </div>
            </div>

            <button type="submit" class="submit-button">Convert</button>
        </form>

        <div id="result-container" class="result-box hidden">
            <p id="exchange-rate-text" class="rate-text">1 USD = 0.92 EUR</p>
            <p id="converted-amount" class="amount-text">92.00 EUR</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
